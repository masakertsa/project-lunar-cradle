<svg xmlns="http://w3.org" viewBox="0 0 900 680" width="900" height="680">
  <!-- Background -->
  <rect width="900" height="680" rx="12" fill="#0f172a"/>
  
  <!-- Header -->
  <text x="450" y="38" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    PROJECT LUNAR-CRADLE: STAGGERED FOUNDATION &amp; RUNNING BOND DECKING
  </text>
  <text x="450" y="60" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    1.2 m Modular Shell Cubes with 0.6 m (60 cm) Overlapping Top Slabs &amp; Thermal Expansion Gaps
  </text>

  <!-- 1. TOP-DOWN VIEW -->
  <text x="60" y="98" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    1. TOP-DOWN PLAN VIEW (OVERLAPPING SLABS &amp; EXPANSION GAPS)
  </text>

  <!-- Underlying Base Cubes -->
  <rect x="110" y="130" width="220" height="170" rx="4" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <rect x="344" y="130" width="220" height="170" rx="4" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <rect x="578" y="130" width="220" height="170" rx="4" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" fill="none"/>

  <!-- Underlying Expansion Gaps -->
  <rect x="330" y="130" width="14" height="170" fill="#fb923c" fill-opacity="0.3"/>
  <rect x="564" y="130" width="14" height="170" fill="#fb923c" fill-opacity="0.3"/>

  <!-- Top Overlapping Decking Slabs -->
  <rect x="227" y="142" width="220" height="146" rx="3" stroke="#cbd5e1" stroke-width="2" fill="#64748b" fill-opacity="0.85"/>
  <rect x="461" y="142" width="220" height="146" rx="3" stroke="#cbd5e1" stroke-width="2" fill="#64748b" fill-opacity="0.85"/>

  <!-- Top Slab Expansion Gap -->
  <rect x="447" y="142" width="14" height="146" fill="#0f172a"/>
  <line x1="454" y1="138" x2="454" y2="292" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Lifting Notches -->
  <rect x="242" y="155" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="416" y="155" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="242" y="267" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="416" y="267" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>

  <rect x="476" y="155" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="650" y="155" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="476" y="267" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>
  <rect x="650" y="267" width="16" height="8" rx="2" fill="#1e293b" stroke="#94a3b8"/>

  <!-- Labels Top View -->
  <text x="337" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TOP SLAB A (1.2 m)</text>
  <text x="337" y="226" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">60 cm + 60 cm overlap</text>

  <text x="571" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TOP SLAB B (1.2 m)</text>
  <text x="571" y="226" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">60 cm + 60 cm overlap</text>

  <text x="165" y="122" fill="#fb923c" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Base Cube 1 (dashed)</text>
  <text x="337" y="122" fill="#fb923c" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hidden Base Gap</text>
  <text x="454" y="312" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Top Gap (centered over Base Cube 2)</text>

  <!-- 2. SIDE CROSS-SECTION VIEW -->
  <line x1="50" y1="345" x2="850" y2="345" stroke="#334155" stroke-width="1.5"/>
  
  <text x="60" y="375" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    2. SIDE CROSS-SECTION VIEW (80 CM TOTAL SHIELDING DEPTH)
  </text>

  <!-- Lunar Regolith Surroundings -->
  <rect x="60" y="455" width="50" height="145" fill="#1e293b"/>
  <rect x="798" y="455" width="42" height="145" fill="#1e293b"/>
  <line x1="60" y1="455" x2="110" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="798" y1="455" x2="840" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="85" y="445" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Regolith</text>

  <!-- Top Decking Slabs -->
  <rect x="110" y="413" width="103" height="42" fill="#788296" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="213" y="413" width="14" height="42" fill="#0f172a"/>
  
  <rect x="227" y="413" width="220" height="42" fill="#788296" stroke="#cbd5e1" stroke-width="2"/>
  <text x="337" y="438" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TOP SLAB A (1.2 m x 20 cm)</text>

  <rect x="447" y="413" width="14" height="42" fill="#0f172a"/>

  <rect x="461" y="413" width="220" height="42" fill="#788296" stroke="#cbd5e1" stroke-width="2"/>
  <text x="571" y="438" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TOP SLAB B (1.2 m x 20 cm)</text>

  <rect x="681" y="413" width="14" height="42" fill="#0f172a"/>
  <rect x="695" y="413" width="103" height="42" fill="#788296" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Base Shell Cubes -->
  <rect x="110" y="455" width="220" height="126" fill="#525866" stroke="#94a3b8" stroke-width="2"/>
  <rect x="136" y="475" width="168" height="86" fill="#2c3038" stroke="#475569" stroke-width="1"/>
  <text x="220" y="514" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 1</text>
  <text x="220" y="530" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Compacted Ballast Core</text>

  <rect x="330" y="455" width="14" height="126" fill="#fb923c" fill-opacity="0.35"/>
  <line x1="337" y1="455" x2="337" y2="581" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="344" y="455" width="220" height="126" fill="#525866" stroke="#94a3b8" stroke-width="2"/>
  <rect x="370" y="475" width="168" height="86" fill="#2c3038" stroke="#475569" stroke-width="1"/>
  <text x="454" y="514" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 2 (1.2 m)</text>
  <text x="454" y="530" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Thermite-Sintered Shell</text>

  <rect x="564" y="455" width="14" height="126" fill="#fb923c" fill-opacity="0.35"/>
  <line x1="571" y1="455" x2="571" y2="581" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="578" y="455" width="220" height="126" fill="#525866" stroke="#94a3b8" stroke-width="2"/>
  <rect x="604" y="475" width="168" height="86" fill="#2c3038" stroke="#475569" stroke-width="1"/>
  <text x="688" y="514" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 3</text>
  <text x="688" y="530" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Compacted Ballast Core</text>

  <!-- Dimensions & Callouts -->
  <line x1="344" y1="398" x2="447" y2="398" stroke="#38bdf8" stroke-width="2"/>
  <text x="395" y="392" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">0.6 m (60 cm)</text>

  <line x1="461" y1="398" x2="564" y2="398" stroke="#38bdf8" stroke-width="2"/>
  <text x="512" y="392" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">0.6 m (60 cm)</text>

  <line x1="344" y1="605" x2="564" y2="605" stroke="#fb923c" stroke-width="2"/>
  <text x="454" y="625" fill="#fb923c" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1.2 m Base Shell Cube</text>

  <text x="337" y="650" fill="#fb923c" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Expansion Joint (Sealed from above by Slab A)</text>

  <!-- Vertical Depth Callouts -->
  <text x="820" y="438" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11">20 cm</text>
  <text x="820" y="522" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">60 cm</text>

  <line x1="862" y1="413" x2="862" y2="581" stroke="#38bdf8" stroke-width="2"/>
  <text x="874" y="502" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" transform="rotate(90 874,502)" text-anchor="middle">TOTAL 80 CM</text>
</svg>
