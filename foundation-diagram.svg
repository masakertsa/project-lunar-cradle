<svg xmlns="http://w3.org" viewBox="0 0 900 680" width="100%" height="auto">
  <defs>
    <!-- Hatching pattern for compacted regolith ballast -->
    <pattern id="ballast" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2c3038"/>
      <circle cx="3" cy="3" r="1.2" fill="#525866"/>
      <circle cx="9" cy="8" r="1.5" fill="#434854"/>
      <circle cx="4" cy="10" r="1" fill="#636a7a"/>
    </pattern>
    
    <!-- Sintered regolith texture -->
    <linearGradient id="sinterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e7685"/>
      <stop offset="100%" stop-color="#4e5461"/>
    </linearGradient>

    <linearGradient id="topSlabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b94a6"/>
      <stop offset="100%" stop-color="#687080"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" rx="12" fill="#0f172a"/>
  
  <!-- Header -->
  <text x="450" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    PROJECT LUNAR-CRADLE: STAGGERED FOUNDATION &amp; RUNNING BOND DECKING
  </text>
  <text x="450" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">
    1.2 m Modular Shell Cubes with 0.6 m (60 cm) Overlapping Top Slabs &amp; Thermal Expansion Gaps
  </text>

  <!-- ========================================================= -->
  <!-- 1. TOP-DOWN VIEW (PÄÄLTÄPÄIN)                             -->
  <!-- ========================================================= -->
  <text x="60" y="98" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">
    1. TOP-DOWN PLAN VIEW (PÄÄLTÄPÄIN: LIMITYS &amp; LIIKUNTASAUMARAOIT)
  </text>

  <!-- Underlying Base Cubes (Dashed outlines showing 1.2m grid underneath) -->
  <!-- Scale: 1.2m = 220px, Expansion Gap = 14px -->
  <g stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <!-- Cube 1 (Left) -->
    <rect x="110" y="130" width="220" height="170" rx="4"/>
    <!-- Cube 2 (Center) -->
    <rect x="344" y="130" width="220" height="170" rx="4"/>
    <!-- Cube 3 (Right) -->
    <rect x="578" y="130" width="220" height="170" rx="4"/>
  </g>

  <!-- Highlight Underlying Expansion Gap between Cube 1 and Cube 2 -->
  <rect x="330" y="130" width="14" height="170" fill="#fb923c" fill-opacity="0.25"/>
  <rect x="564" y="130" width="14" height="170" fill="#fb923c" fill-opacity="0.25"/>

  <!-- Top Overlapping Decking Slabs (Offset by 0.6m = 117px) -->
  <g stroke="#cbd5e1" stroke-width="2" fill="url(#topSlabGrad)" fill-opacity="0.82">
    <!-- Slab A (Covers right half of Cube 1 + gap + left half of Cube 2) -->
    <rect x="227" y="142" width="220" height="146" rx="3"/>
    <!-- Slab B (Covers right half of Cube 2 + gap + left half of Cube 3) -->
    <rect x="461" y="142" width="220" height="146" rx="3"/>
  </g>

  <!-- Top Slab Expansion Gap (14px wide at x=447..461, directly over center of Cube 2!) -->
  <rect x="447" y="142" width="14" height="146" fill="#0f172a"/>
  <line x1="454" y1="138" x2="454" y2="292" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Lifting Notches on Top Slabs -->
  <g fill="#1e293b" stroke="#94a3b8" stroke-width="1">
    <rect x="242" y="155" width="16" height="8" rx="2"/>
    <rect x="416" y="155" width="16" height="8" rx="2"/>
    <rect x="242" y="267" width="16" height="8" rx="2"/>
    <rect x="416" y="267" width="16" height="8" rx="2"/>

    <rect x="476" y="155" width="16" height="8" rx="2"/>
    <rect x="650" y="155" width="16" height="8" rx="2"/>
    <rect x="476" y="267" width="16" height="8" rx="2"/>
    <rect x="650" y="267" width="16" height="8" rx="2"/>
  </g>

  <!-- Labels for Top-Down View -->
  <text x="337" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TOP SLAB A (1.2 m)</text>
  <text x="337" y="226" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">60 cm + 60 cm overlap</text>

  <text x="571" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TOP SLAB B (1.2 m)</text>
  <text x="571" y="226" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">60 cm + 60 cm overlap</text>

  <!-- Callouts Top View -->
  <text x="165" y="122" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Base Cube 1 (dashed)</text>
  <text x="337" y="122" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hidden Base Gap</text>
  <text x="454" y="312" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▲ Top Gap (centered over Base Cube 2)</text>


  <!-- ========================================================= -->
  <!-- 2. SIDE CROSS-SECTION VIEW (SIVUKUVA / POIKKILEIKKAUS)    -->
  <!-- ========================================================= -->
  <line x1="50" y1="345" x2="850" y2="345" stroke="#334155" stroke-width="1.5"/>
  
  <text x="60" y="375" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">
    2. SIDE CROSS-SECTION VIEW (SIVUPOIKKILEIKKAUS: 80 CM KOKONAISSYVYYS)
  </text>

  <!-- Lunar Regolith Ground Surroundings -->
  <rect x="60" y="455" width="50" height="145" fill="#1e293b"/>
  <rect x="798" y="455" width="42" height="145" fill="#1e293b"/>
  <line x1="60" y1="455" x2="110" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="798" y1="455" x2="840" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="85" y="445" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Regolith</text>

  <!-- TOP DECKING SLABS (20 cm thick = 42px) -->
  <!-- Left partial slab -->
  <rect x="110" y="413" width="103" height="42" fill="url(#topSlabGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Gap 1 (14px) -->
  <rect x="213" y="413" width="14" height="42" fill="#0f172a"/>
  
  <!-- Full Center-Left Top Slab A (220px = 1.2m) -->
  <rect x="227" y="413" width="220" height="42" fill="url(#topSlabGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="337" y="438" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TOP SLAB A (1.2 m × 20 cm)</text>

  <!-- Center Top Gap (14px at x=447..461) -->
  <rect x="447" y="413" width="14" height="42" fill="#0f172a"/>

  <!-- Full Center-Right Top Slab B (220px = 1.2m) -->
  <rect x="461" y="413" width="220" height="42" fill="url(#topSlabGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="571" y="438" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TOP SLAB B (1.2 m × 20 cm)</text>

  <!-- Gap 3 (14px) -->
  <rect x="681" y="413" width="14" height="42" fill="#0f172a"/>
  <!-- Right partial slab -->
  <rect x="695" y="413" width="103" height="42" fill="url(#topSlabGrad)" stroke="#cbd5e1" stroke-width="1.5"/>


  <!-- BASE SHELL CUBES (60 cm deep = 126px, 1.2m wide = 220px) -->
  <!-- Cube 1 (x=110..330) -->
  <g>
    <!-- Outer sintered shell -->
    <rect x="110" y="455" width="220" height="126" fill="url(#sinterGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Hollow core filled with compacted regolith ballast -->
    <rect x="136" y="475" width="168" height="86" fill="url(#ballast)" stroke="#475569" stroke-width="1"/>
    <text x="220" y="514" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 1</text>
    <text x="220" y="530" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Compacted Ballast Core</text>
  </g>

  <!-- Base Expansion Joint 1 (14px at x=330..344) -->
  <rect x="330" y="455" width="14" height="126" fill="#fb923c" fill-opacity="0.3"/>
  <line x1="337" y1="455" x2="337" y2="581" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Cube 2 (x=344..564) -->
  <g>
    <rect x="344" y="455" width="220" height="126" fill="url(#sinterGrad)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="370" y="475" width="168" height="86" fill="url(#ballast)" stroke="#475569" stroke-width="1"/>
    <text x="454" y="514" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 2 (1.2 m)</text>
    <text x="454" y="530" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Thermite-Sintered Shell</text>
  </g>

  <!-- Base Expansion Joint 2 (14px at x=564..578) -->
  <rect x="564" y="455" width="14" height="126" fill="#fb923c" fill-opacity="0.3"/>
  <line x1="571" y1="455" x2="571" y2="581" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Cube 3 (x=578..798) -->
  <g>
    <rect x="578" y="455" width="220" height="126" fill="url(#sinterGrad)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="604" y="475" width="168" height="86" fill="url(#ballast)" stroke="#475569" stroke-width="1"/>
    <text x="688" y="514" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BASE CUBE 3</text>